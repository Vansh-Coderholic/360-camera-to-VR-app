<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>360 VR Player - Stable Gaze & Hotspots</title>
    
    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/omnitone@1.3.0/build/omnitone.min.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #vr-container { width: 100vw; height: 100vh; }
        
        .controls-overlay {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 999;
        }

        .btn {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: bold;
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: background 0.2s;
        }

        .btn:hover { background-color: #e0e0e0; }
        #vr-toggle-btn { display: none; background-color: #007bff; color: #fff; }

        #hotspot-card {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #00ffcc;
            padding: 12px 24px;
            border-radius: 10px;
            display: none;
            z-index: 1000;
            text-align: center;
            font-size: 16px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }

        #error-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff4d4d;
            background: rgba(0,0,0,0.85);
            padding: 10px 20px;
            border-radius: 8px;
            display: none;
            z-index: 1001;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="error-overlay"></div>
    <div id="hotspot-card">Hotspot Triggered</div>
    
    <div class="controls-overlay">
        <button id="start-btn" class="btn">Start Experience</button>
        <button id="vr-toggle-btn" class="btn">Toggle Split-Screen VR</button>
    </div>

    <video id="video-source" src="test360.mp4" loop crossorigin="anonymous" playsinline style="display: none;"></video>
    <div id="vr-container"></div>

    <script>
        // --- Global States ---
        let audioContext, foaRenderer, sourceNode;
        let isAudioActive = false;
        let isVRMode = false;
        let isGyroActive = false;

        // View Orientation Variables
        let isPointerDown = false;
        let pointerX = 0, pointerY = 0;
        let lon = 0, lat = 0;
        let phi = 0, theta = 0;

        // Gyroscope tracking variables
        let deviceAlpha = 0, deviceBeta = 0, deviceGamma = 0;

        // Gaze Raycasting & Hotspots Variables
        const raycaster = new THREE.Raycaster();
        const hotspots = [];
        let hoveredHotspot = null;
        let gazeStartTime = 0;
        const GHOST_DWELL_TIME = 1500; // 1.5 seconds gaze threshold

        const video = document.getElementById('video-source');
        const startBtn = document.getElementById('start-btn');
        const vrToggleBtn = document.getElementById('vr-toggle-btn');
        const container = document.getElementById('vr-container');
        const errorOverlay = document.getElementById('error-overlay');
        const hotspotCard = document.getElementById('hotspot-card');

        video.addEventListener('error', () => {
            errorOverlay.style.display = 'block';
            errorOverlay.innerText = "Error: 'test360.mp4' not found in project directory.";
        });

        // --- Three.js Setup ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        scene.add(camera);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // WebGL Context Loss Recovery
        renderer.domElement.addEventListener('webglcontextlost', (e) => {
            e.preventDefault();
            console.warn("WebGL Context Lost. Attempting recovery...");
        }, false);

        // 360 Inverted Sphere
        const geometry = new THREE.SphereGeometry(500, 60, 40);
        geometry.scale(-1, 1, 1);
        
        const texture = new THREE.VideoTexture(video);
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;
        texture.format = THREE.RGBFormat;

        const material = new THREE.MeshBasicMaterial({ map: texture });
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

        camera.position.set(0, 0, 0.1);

        // --- Crosshair Reticle Attachment ---
        const reticleGeo = new THREE.RingGeometry(0.006, 0.012, 32);
        const reticleMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, depthTest: false });
        const reticle = new THREE.Mesh(reticleGeo, reticleMat);
        reticle.position.set(0, 0, -1);
        reticle.renderOrder = 999;
        camera.add(reticle);

        // --- Helper Function: Create Clean Interactive Hotspot ---
        function createHotspot(x, y, z, colorHex, label, actionCallback) {
            const group = new THREE.Group();

            // Core Marker (Solid Circle)
            const coreGeo = new THREE.CircleGeometry(12, 32);
            const coreMat = new THREE.MeshBasicMaterial({ color: colorHex, side: THREE.DoubleSide });
            const coreMesh = new THREE.Mesh(coreGeo, coreMat);
            group.add(coreMesh);

            // Outer Ring Glow
            const ringGeo = new THREE.RingGeometry(14, 18, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: colorHex, side: THREE.DoubleSide, transparent: true, opacity: 0.6 });
            const ringMesh = new THREE.Mesh(ringGeo, ringMat);
            group.add(ringMesh);

            group.position.set(x, y, z);
            group.userData = { label: label, action: actionCallback, ring: ringMesh };

            scene.add(group);
            hotspots.push(coreMesh);
            coreMesh.userData.parentGroup = group;
        }

        // Add Sample Hotspots
        createHotspot(0, 30, -350, 0x00ffcc, "Play / Pause Video", () => {
            if (video.paused) {
                video.play();
                showCard("Video Resumed");
            } else {
                video.pause();
                showCard("Video Paused");
            }
        });

        createHotspot(300, -20, -150, 0xff0055, "Info Point: Stage Area", () => {
            showCard("Spatial Marker: Front Stage Area");
        });

        createHotspot(-300, 40, -100, 0xffcc00, "Reset Camera View", () => {
            lon = 0;
            lat = 0;
            showCard("Camera Orientation Recentered");
        });

        let cardTimer = null;
        function showCard(text) {
            hotspotCard.innerText = text;
            hotspotCard.style.display = 'block';
            if (cardTimer) clearTimeout(cardTimer);
            cardTimer = setTimeout(() => { hotspotCard.style.display = 'none'; }, 3000);
        }

        // --- Controls Handling ---
        function onPointerDown(e) {
            isPointerDown = true;
            pointerX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
            pointerY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
        }

        function onPointerMove(e) {
            if (!isPointerDown) return;
            const x = e.clientX || (e.touches && e.touches[0].clientX) || 0;
            const y = e.clientY || (e.touches && e.touches[0].clientY) || 0;

            lon -= (x - pointerX) * 0.15;
            lat += (y - pointerY) * 0.15;
            lat = Math.max(-85, Math.min(85, lat));

            pointerX = x;
            pointerY = y;
        }

        function onPointerUp() { isPointerDown = false; }

        window.addEventListener('pointerdown', onPointerDown);
        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);

        function handleOrientation(e) {
            if (e.alpha !== null) {
                isGyroActive = true;
                deviceAlpha = THREE.MathUtils.degToRad(e.alpha);
                deviceBeta = THREE.MathUtils.degToRad(e.beta);
                deviceGamma = THREE.MathUtils.degToRad(e.gamma);
            }
        }

        // --- Safe Gaze Interaction ---
        function processGazeSelection() {
            try {
                raycaster.setFromCamera({ x: 0, y: 0 }, camera);
                const intersects = raycaster.intersectObjects(hotspots);

                if (intersects.length > 0) {
                    const targetCore = intersects[0].object;
                    const parentGroup = targetCore.userData ? targetCore.userData.parentGroup : null;

                    if (parentGroup) {
                        if (hoveredHotspot !== parentGroup) {
                            hoveredHotspot = parentGroup;
                            gazeStartTime = performance.now();
                            reticle.material.color.setHex(0x00ffcc);
                        } else {
                            const elapsed = performance.now() - gazeStartTime;
                            const progress = Math.min(elapsed / GHOST_DWELL_TIME, 1);
                            
                            const scaleFactor = 1 + progress * 1.2;
                            reticle.scale.set(scaleFactor, scaleFactor, 1);

                            if (elapsed >= GHOST_DWELL_TIME) {
                                if (typeof parentGroup.userData.action === 'function') {
                                    parentGroup.userData.action();
                                }
                                hoveredHotspot = null;
                                reticle.scale.set(1, 1, 1);
                                reticle.material.color.setHex(0xffffff);
                            }
                        }
                    }
                } else {
                    if (hoveredHotspot) {
                        hoveredHotspot = null;
                        reticle.scale.set(1, 1, 1);
                        reticle.material.color.setHex(0xffffff);
                    }
                }
            } catch (err) {
                console.error("Gaze Selection Error:", err);
            }
        }

        // --- Initialization ---
        startBtn.addEventListener('click', async () => {
            try {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                    }
                } else {
                    window.addEventListener('deviceorientation', handleOrientation);
                }

                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }

                try {
                    foaRenderer = Omnitone.createFOARenderer(audioContext);
                    await foaRenderer.initialize();
                    sourceNode = audioContext.createMediaElementSource(video);
                    sourceNode.connect(foaRenderer.input);
                    foaRenderer.output.connect(audioContext.destination);
                    foaRenderer.setRenderingMode('ambisonic');
                    isAudioActive = true;
                } catch (audioErr) {
                    console.warn("FOA fallback to direct stereo:", audioErr);
                    if (!sourceNode) sourceNode = audioContext.createMediaElementSource(video);
                    sourceNode.connect(audioContext.destination);
                }

                await video.play();
                startBtn.style.display = 'none';
                vrToggleBtn.style.display = 'block';
            } catch (err) {
                console.error("Initialization error:", err);
                errorOverlay.style.display = 'block';
                errorOverlay.innerText = "Error initializing: " + err.message;
            }
        });

        vrToggleBtn.addEventListener('click', () => {
            isVRMode = !isVRMode;
            vrToggleBtn.innerText = isVRMode ? "Exit Split-Screen VR" : "Toggle Split-Screen VR";
            if (!isVRMode) {
                renderer.setScissorTest(false);
            }
        });

        // --- Render Loop ---
        function animate() {
            requestAnimationFrame(animate);

            // 1. Orient Camera
            if (isGyroActive) {
                const euler = new THREE.Euler(deviceBeta, deviceAlpha, -deviceGamma, 'YXZ');
                camera.quaternion.setFromEuler(euler);
            } else {
                lat = Math.max(-85, Math.min(85, lat));
                phi = THREE.MathUtils.degToRad(90 - lat);
                theta = THREE.MathUtils.degToRad(lon);

                camera.position.x = 0.1 * Math.sin(phi) * Math.cos(theta);
                camera.position.y = 0.1 * Math.cos(phi);
                camera.position.z = 0.1 * Math.sin(phi) * Math.sin(theta);
                camera.lookAt(0, 0, 0);
            }

            // 2. Billboarding: Face Hotspots toward Camera
            hotspots.forEach(core => {
                if (core.userData && core.userData.parentGroup) {
                    core.userData.parentGroup.lookAt(camera.position);
                }
            });

            // 3. Process Gaze Selection
            processGazeSelection();

            // 4. Sync Spatial Audio Matrix
            if (isAudioActive && foaRenderer) {
                foaRenderer.setRotationMatrix4(camera.matrixWorld.elements);
            }

            // 5. Render Pass
            if (!isVRMode) {
                renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.render(scene, camera);
            } else {
                const halfWidth = window.innerWidth / 2;
                const height = window.innerHeight;

                renderer.setScissorTest(true);

                // Left Eye
                renderer.setViewport(0, 0, halfWidth, height);
                renderer.setScissor(0, 0, halfWidth, height);
                camera.aspect = halfWidth / height;
                camera.updateProjectionMatrix();
                renderer.render(scene, camera);

                // Right Eye
                renderer.setViewport(halfWidth, 0, halfWidth, height);
                renderer.setScissor(halfWidth, 0, halfWidth, height);
                camera.aspect = halfWidth / height;
                camera.updateProjectionMatrix();
                renderer.render(scene, camera);
            }
        }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
